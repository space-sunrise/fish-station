- type: construction
  name: crafting-menu-name-weldsword
  id: Weldsword
  graph: WeldswordGraph
  startNode: start
  targetNode: sword
  category: construction-category-weapons
  objectType: Item
  description: crafting-menu-text-weldsword
          
- type: constructionGraph 
  id: WeldswordGraph
  start: start
  graph:
    - node: start
      edges:
      - to: sword
        steps:
        - tag: AnomalyCore
          name: crafting-menu-ingredient-anomaly-core
          icon:
            sprite: Structures/Specific/Anomalies/Cores/pyro_core.rsi
            state: core
        - material: Plasma
          amount: 1
          doAfter: 15
        - component: Welder
          name: crafting-menu-ingredient-welder
          icon:
            sprite: "Objects/Tools/welder.rsi"
            state: "icon"
    - node: sword
      entity: Weldsword
      edges:
        - to: double
          steps:
            - tag: Weldsword
              doAfter: 2
    - node: double
      entity: WeldswordDouble
      edges:
        - to: deconstruct
          steps:
            - tool: Screwing
              doAfter: 2
    - node: deconstruct
      actions:
        - !type:GivePrototype
          prototype: Weldsword
          amount: 2
        - !type:DeleteEntity