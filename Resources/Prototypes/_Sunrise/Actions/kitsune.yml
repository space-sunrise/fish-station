- type: entity
  parent: BaseAction
  id: ActionKitsuneTransform
  name: Fox Transform
  description: "Transform into a nine-tailed fox form, consuming 50 blood. Takes 5 seconds."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: /Textures/Interface/Actions/actions.rsi
      state: transform
    useDelay: 5
    temporary: true
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:KitsuneTransformActionEvent

- type: entity
  parent: BaseAction
  id: ActionKitsuneRevert
  name: Revert Form
  description: "Revert from fox form back to humanoid form. Only available in fox form."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: /Textures/Interface/Actions/actions.rsi
      state: revert
    useDelay: 2
    temporary: true
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:KitsuneRevertActionEvent
