#TehFab
- type: entity
  categories: [ HideSpawnMenu ]
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: MaterialReclaimerWM
  name: переработчик продаж
  description: Засунь сюда для переработки в валюту () огнестрельное оружие, лазерное оружие, мех оружие, рсу, шприцемет, мозг.
  components:
  - type: Construction
    graph: CatwalkWMDop
    node: CatwalkWMDop
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    snapCardinals: true
    netsync: false
    layers:
    - state: reclaimer
  - type: Appearance
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false
    color: "#da824d"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
  - type: PowerSwitch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MaterialReclaimer
    minimumProcessDuration: 0
    enabled: true
    scaleProcessSpeed: false
    whitelist:
      components:
       - PhysicalComposition
      tags:
       - SellTagWM
       - TehfabTagWM
    blacklist:
      tags:
       - TehfabTagMaterialWM
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
      params:
        volume: 5
       # maxdistance: 5
        loop: true
  - type: MaterialStorage
    insertOnInteract: false
  - type: ContainerContainer
    containers:
      active-material-reclaimer-container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
  - type: DrainableSolution
    solution: output
  - type: ExaminableSolution
    solution: output
  - type: StaticPrice
    price: 500
  - type: ApcPowerReceiver
    powerLoad: 500

