#Gate
- type: entity
  categories: [ HideSpawnMenu, Debug ]
  parent: BaseGateway
  id: BaseGatewayWM
  components:
  #  - type: RadarBlip
  #    color: "#48a4fb"
  #    scale: 0.4
  #    shape: Circle
  #    requireInSpace: false
    - type: Fixtures
      fixtures:
        portalFixture:
          shape:
            !type:PhysShapeCircle
            radius: 0.8
          mask:
          - FullTileMask
          layer:
          - BulletImpassable
          - Opaque
         # layer:
          #- WallLayer
         # hard: false
    - type: MaterialStorage
      whitelist:
        tags:
          - TehfabTagMaterialWM
    - type: Animateable
    - type: InteractionOutline
    - type: WiresPanel
    - type: ActivatableUI
      key: enum.LatheUiKey.Key
    - type: ActivatableUIRequiresPower
    - type: UserInterface
      interfaces:
        enum.LatheUiKey.Key:
          type: LatheBoundUserInterface
        enum.ResearchClientUiKey.Key:
          type: ResearchClientBoundUserInterface
    - type: Damageable
      damageContainer: Inorganic
    - type: TimedSpawner
      chance: 1
      intervalSeconds: 9000
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 1
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 5000
          behaviors:
            - !type:TriggerBehavior
            - !type:SpawnEntitiesBehavior
              spawn:
                SingularityWM:
                  min: 10
                  max: 10
            - !type:DoActsBehavior
              acts: [ "Destruction" ] 
    - type: Repairable
      qualityNeeded: "Anchoring"
      doAfterDelay: 1
      damage:
        groups:
          Brute: -2
          Burn: -2
   # - type: ExplodeOnTrigger
 #   - type: Explosive
