- type: entity
  id: FloorNotSpawmDeleteWM
  name: тайл анти удаления спавна
  description: не ползуйся рсу
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: Structures/catwalk.rsi
    layers:
      - state: catwalk_preview
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: MaterialReclaimer
    powered: true
    minimumProcessDuration: 0
    enabled: true
    scaleProcessSpeed: false
    whitelist:
      components:
       - PhysicalComposition
      tags:
       - SellTagWM
       - TehfabTagWM
    blacklist:
      tags:
       - TehfabTagMaterialWM
    sound:
      path: /Audio/Ambience/Objects/crushing.ogg
      params:
        volume: 5
       # maxdistance: 5
        loop: true
  - type: MaterialStorage
    insertOnInteract: false
  - type: ContainerContainer
    containers:
      active-material-reclaimer-container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
  - type: DrainableSolution
    solution: output
  - type: ExaminableSolution
    solution: output


