- type: constructionGraph
  id: CatwalkWM
  start: start
  graph:
    - node: start
      edges:
        - to: CatwalkWM
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MetalRod
              amount: 0

    - node: CatwalkWM
      entity: CatwalkWM
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: PartRodMetal1
                amount: 0
          - !type:DeleteEntity {}
          steps:
            - tool: Cutting
              doAfter: 1


- type: constructionGraph
  id: CatwalkWMDop
  start: start
  graph:
    - node: start
      edges:
        - to: CatwalkWMDop
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MetalRod
              amount: 0

    - node: CatwalkWMDop
      entity: CatwalkWM
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: PartRodMetal1
                amount: 0
          - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 7

- type: entity
  categories: [ HideSpawnMenu ]
  parent: PortableGeneratorJrPacman
  id: PortableGeneratorJrPacmanCoreWM
  components:
  - type: Construction
    graph: CatwalkWM
    node: CatwalkWM
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 10
        maxVol: 50
  - type: SolutionRegeneration
    solution: tank
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 0.085
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 150
        behaviors:
          - !type:SpillBehavior
            solution: tank
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTypeTrigger
          damageType: Piercing
          damage: 100
        behaviors:
          - !type:SolutionExplosionBehavior
            solution: tank

