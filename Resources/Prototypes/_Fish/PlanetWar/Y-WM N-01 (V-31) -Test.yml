    graph: CatwalkWMDop
    node: CatwalkWMDop
  - type: RCDDeconstructable
    cost: 1
    delay: 1
  - type: TriggerOnStepTrigger
  - type: PlacementReplacement
    key: web
  - type: Appearance
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Physics
  - type: Damageable
    damageContainer: Inorganic
  #- type: Slippery
   # launchForwardsMultiplier: 0.1
 #   requiredSlipSpeed: 1
  - type: StepTrigger
    requiredTriggeredSpeed: 0.01
    intersectRatio: 0.2
  - type: LandMine
    sound:
        path: /Audio/Effects/beep_landmine.ogg
        params:
            maxDistance: 10
  - type: DeleteOnTrigger
  - type: ExplodeOnTrigger
  - type: ExplosionResistance
    damageCoefficient: 0.45
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Shock
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - SlipLayer
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 1000
        mask:
        - ItemMask

