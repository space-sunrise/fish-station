- type: entity
  categories: [ HideSpawnMenu, Debug ]
  parent: [ ReinforcementRadioSyndicateNukeops, MarkerBase ]
  id: 1ReinforcementCoreWM
  name: Призыв Боевика
  description: Хули тут сказать.
  suffix: WM
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Item
    size: Huge
  - type: Sprite
    scale: 0.5, 0.5
    sprite: Objects/Misc/Handy_Flags/NT_handy_flag.rsi
    layers:
    - state: icon
  - type: GhostRole
    name: Боевик
    description: Фракция Республиканцы
    mindRoles:
    - MindRoleGhostRoleNeutral
    raffle:
      settings: LifeWM
  - type: GhostRoleMobSpawner
    prototype: MobHumanCoreP0WM
