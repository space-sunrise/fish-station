#Human
#Respublic  
- type: entity
  categories: [ HideSpawnMenu, Debug ]
  parent: MobHuman
  id: BaseMobHumanWM
  components:
    - type: RemoveComponentsOnTrigger
      keysIn:
       - stop
      targetUser: true
      triggerOnce: false
      components:
      - type: ExplosionResistance
    - type: AddComponentsOnTrigger
      keysIn:
       - start
      targetUser: false
      triggerOnce: false
      components:
      - type: ExplosionResistance
        damageCoefficient: 0.01
    - type: TriggerOnUnbuckled
      keyOut: stop
    - type: TriggerOnBuckled
      keyOut: start
    - type: Buckle
      dontCollide: true
    - type: CanEscapeInventory
    - type: AntagImmune
    - type: Transform
    - type: CanJump
      isOnlyEmotion: true
    - type: Thirst
      baseDecayRate: 0
    - type: Hunger
      baseDecayRate: 0
   # - type: RandomHumanoidAppearance
   #   randomizeName: false
    - type: MovementIgnoreGravity
    - type: Stamina
      baseCritThreshold: 999999
      decay: 999999
      cooldown: 1
    - type: Bloodstream
      bleedPuddleThreshold: 0.01
      bloodlossDamage:
        types:
          Bloodloss: 0.00001
      bloodlossHealDamage:
        types:
          Bloodloss: -1000
      bloodRefreshAmount: 10000000
   #   bloodlosThreshold: 1
      bloodReferenceSolution:
        reagents:
        - ReagentId: ClearBlood
          Quantity: 100
     # bloodReagent: ClearBlood
     # bloodMaxVolume: 10000000
   # - type: NoSlip
    - type: RespiratorImmunity
    - type: MobThresholds
      thresholds:
        0: Alive
        90: Critical
        300: Dead
   # - type: TriggerOnMobstateChange
   #   mobState:
   #   - Dead
   # - type: RemoveComponentsOnTrigger
   #   triggerOnce: false
   #   components:
    #  - type: RadarBlip
    - type: PassiveDamage
      allowedStates:
      - Critical
      - Dead
      damageCap: 100000
      damage:
        types:
          Cellular: 3
    - type: PressureImmunity
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Cellular
          damage: 600
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            AcidifierWM:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: gib
      - trigger:
          !type:DamageTrigger
          damage: 16000
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            AcidifierWM:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: gib
   #   - trigger:
    #      !type:DamageTypeTrigger
    #      damageType: Heat
    #      damage: 2500
     #   behaviors:
     #   - !type:TriggerBehavior
      #  - !type:BurnBodyBehavior { }
       # - !type:PlaySoundBehavior
       #   sound:
        #    collection: MeatLaserImpact
   # - type: ShowJobIcons
    - type: NameIdentifier
      group: GenericNumber
    - type: GhostTakeoverAvailable
    - type: Damageable




