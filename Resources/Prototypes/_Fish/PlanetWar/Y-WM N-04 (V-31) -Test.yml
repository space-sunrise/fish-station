#Id
- type: entity
  parent: BaseItem #BasePDA
  id: MusicianPDAForWM
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-musician
  - type: PdaBorderColor
    borderColor: "#0000e3"
    accentVColor: "#0000e3"
  - type: Instrument
    respectMidiLimits: false
    allowProgramChange: true
    allowPercussion: true
    handheld: true
    program: 0 #2
    bank: 0 #100 
  - type: Pda
    paiSlot:
      priority: -2
      whitelist:
        components:
        - PAI
    penSlot:
    #  startingItem: Pen
      priority: -1
      whitelist:
        tags:
        - Write
    idSlot:
      name: access-id-card-component-default
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
        - IdCard
#  - type: PdaVisuals
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      PDA-id: !type:ContainerSlot {}
      PDA-pen: !type:ContainerSlot {}
      PDA-pai: !type:ContainerSlot {}
      Cartridge-Slot: !type:ContainerSlot {}
      program-container: !type:Container
  - type: ItemSlots
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
    - Belt
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    radius: 9
    netsync: true #включает свет у всех
    falloff: 2
    softness: 1
    autoRot: true
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
     # - CrewManifestCartridge
     # - NotekeeperCartridge
     # - NanoTaskCartridge
     # - NewsReaderCartridge
    # Sunrise-Start
    #  - NavigatorCartridge
      - MessengerCartridge
    # Sunrise-End
    cartridgeSlot:
      priority: -1
      name: device-pda-slot-component-slot-name-cartridge
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
          - Cartridge
  - type: ActivatableUI
    key: enum.PdaUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface

