- type: entity
  id: EnergyDomeCoreWM
  name: стационарное силовое поле республики
  description: поле, питание от кабеля 
  parent: BaseMachine
  placement:
    mode: SnapgridCenter
  components:
  #- type: RadarBlip
  #  color: "#0000e3"
  #  scale: 0.5
  #  shape: Square
  #  requireInSpace: false
  - type: AutoLinkReceiver
    channel: EnergyDomeAutoLink
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: SignalButtonAutoWM
  - type: Anchorable
    delay: 60
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 99999999
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    snapCardinals: true
    noRot: true
    layers:
      - state: energyShildBase
      - state: energyShildCoreUntil
        shader: unshaded
 #тут вырезка была 
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: UseDelay
    delay: 240.0
  - type: InteractionOutline
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 1
#  - type: Signaller
  #- type: TriggerOnSpawn
  #- type: SignalOnTrigger
 #   port: Toggle
  - type: DeviceLinkSink
    ports:
    - Toggle
    - On
    - Off
  - type: EnergyDomeGenerator
    enabled: true
    damageEnergyDraw: 1
    domePrototype: EnergyDomeCore
    canDeviceNetworkUse: true
  - type: Battery
    maxCharge: 650
    startingCharge: 0
  - type: ApcPowerReceiverBattery
    idleLoad: 5
    batteryRechargeRate: 50
    batteryRechargeEfficiency: 3
  - type: ExtensionCableReceiver
  - type: BatterySelfRecharger
    autoRechargeRate: 200
   # autoRecharge: True
  - type: ApcPowerReceiver
    powerLoad: 40

- type: entity
  id: EnergyDomeArmWM
  name: стационарное силовое поле повстанцев
  parent: EnergyDomeCoreWM
  placement:
    mode: SnapgridCenter
  components:
 # - type: RadarBlip
 #   color: "#e50000"
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    layers:
      - state: energyShildBase
      - state: energyShildArmUntil
        shader: unshaded
  - type: EnergyDomeGenerator
    domePrototype: EnergyDomeArm


