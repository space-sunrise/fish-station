#Легкий двухместный гиродерм


- type: entity
  id: MechLightCoreWM
  suffix: WM
  parent: 
   - MechHeavyCoreWM
  name: легкий двухместный гиродерм республики
  components:
 # - type: RadarBlip
 #   scale: 0.6
  - type: Blindable
  - type: ContainmentField
    throwForce: 0
  - type: PointLight
    radius: 10
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 10000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Reflect
    reflectProb: 0.1
    spread: 90
  - type: Sprite
    scale: 1.05, 1.05
    sprite: /Textures/_Fish/PlanetWar/WM2/32xSprait.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: mechGygaxCore
  - type: MeleeThrowOnHit
    distance: 1
    speed: 15
  - type: Mech
    baseState: mechGygaxCore
    openState: mechGygaxCoreOpen
    brokenState: mechGygaxCoreDead
    mechToPilotDamageMultiplier: 0.4
    maxEquipmentAmount: 1
    startingEquipment:
      - WeaponMechCombatLightWM
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: PassiveDamage
    damageCap: 4000
  - type: MeleeWeapon
    attackRate: 0.75
    range: 1.5
    damage:
      types:
        Blunt: 30
        Structural: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 6.5
    baseSprintSpeed: 5
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageSmallWM
  - type: Strap
    handBuckle: true
    position: Stand
    buckleOffsets: 
    - "0,0.55"
    size: 20
    whitelist:
      components:
       - AdminMinigun

