- type: entity
  categories: [ HideSpawnMenu ]
  id: DronCoreTurretMineWM
  name: Дрон
  parent: DronCoreWM
  components:
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: AutoImplant
    implants:
    - LandmineImplantCoreWM
  - type: GhostRole
    name: Вооруженый Дрон
    description: Фракция Республиканцы
    raffle:
      settings: WM
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM2/33xSprait.rsi
    noRot: false
    layers:
      - state: droneP1shedow
        noRot: false
        scale: 1.1, 1.1
      - state: droneP1Anim
        noRot: false
        scale: 1.05, 1.05
      - state: droneP1pimpblue
        noRot: false
        scale: 1.05, 1.05
        shader: unshaded
        offset: 0, 0
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 8
    intensitySlope: 1
    maxIntensity: 8
  - type: MovementSpeedModifier
    baseWalkSpeed : 15
    baseSprintSpeed : 9
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 85
      behaviors:
      - !type:TriggerBehavior
  - type: MobThresholds
    thresholds:
      0: Alive
      86: Dead
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 9 #8.5
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: false
        layer:
          - SlipLayer
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 500000
        layer:
        - MobLayer
        mask:
        - MobMask
  - type: Battery
    maxCharge: 60
    startingCharge: 60
  - type: BatterySelfRecharger
    autoRechargeRate: 1
  - type: Gun
    fireRate: 4
    minAngle: -8
    maxAngle: 25
    selectedMode: FullAuto  #FullAuto
    availableModes:
      - FullAuto  
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/SMGs/mp38/mp38_shot.ogg
      params:
        volume: -3
  - type: BatteryAmmoProvider
    proto: CartridgePistolWM
    fireCost: 2
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: PortalCoreTinyWM

