#Units

- type: entity
  parent: BaseItem
  id: BoxDronCoreWM
  name: Развертка дрона
  components:
  - type: PhysicalComposition
    materialComposition:
      MoneyWarMizMaterial: 100
  - type: SpawnItemsOnUse
    uses: 1
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/unwrap.ogg
    items:
    - id: DronCoreWM
  - type: Item
    sprite: Objects/Storage/boxes.rsi
    size: Small
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    layers:
      - state: droneAnim

- type: entity
  categories: [ HideSpawnMenu ]
  id: DronCoreWM
  name: Дрон
  parent: MobSiliconBase
  components:
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
  - type: RadarConsole
    followEntity: true
 # - type: RadarBlip
 #   color: "#0000e3"
 #   scale: 0.4
 #   shape: Circle
 #   requireInSpace: false
  - type: Blindable
    isBlind: false
  - type: ToggleableNightVision
    effect: EffectNightVisioCoreDron
  - type: ShowJobIcons
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
    predicted: true
  - type: CartridgeAmmo
    proto: BulletGrenadeFlashBang
    deleteOnSpawn: true
 # - type: ActionGrant
 #   actions:
  #  - ActionToggleLighting 
  - type: ExplosionResistance
    damageCoefficient: 1
  - type: AutoImplant
    implants:
    - BombImplantWM
  - type: GhostTakeoverAvailable
#  - type: Muted
  - type: GhostRole
    name: Взрывной Дрон
    description: Фракция Республиканцы
    raffle:
      settings: WM
  - type: CombatMode
    toggleMouseRotator: true
  - type: StepTrigger
    blacklist:
      components:
      - AdminMinigun
    requiredTriggeredSpeed: 0.2
  - type: NpcFactionMember
    factions:
    - CoreFaction
  - type: Access
    tags:
    - AssCoreBase
  - type: ActiveRadio
    channels:
    - RadioChannelCore
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM/32xSprait.rsi
    noRot: false
    layers:
      - state: shedow
        noRot: false
        scale: 1.05, 1.05
      - state: droneAnim
        noRot: false
        offset: 0, 0
      - state: dronepimpblue
        noRot: false
        shader: unshaded
        offset: 0, 0
  - type: MovementIgnoreGravity
    weightless: True
  - type: IntrinsicRadioReceiver
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 5
    intensitySlope: 1
    maxIntensity: 5
  - type: MovementSpeedModifier
    baseWalkSpeed : 15
    baseSprintSpeed : 12
  - type: Stamina
    baseCritThreshold: 1209999
  - type: Destructible
    thresholds:
   # - trigger:
     #   !type:DamageTrigger
     #   damage: 65
     # behaviors:
       # - !type:SpawnEntitiesBehavior
         # spawn:
          #  LandMineFleshBombDroneDeathWM:
          #    min: 1
          #    max: 1
       # - !type:DoActsBehavior
         # acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
       # !type:DamageTypeTrigger
      #  damageType: Shock
     #   damage: 64
      behaviors:
      - !type:TriggerBehavior
  - type: MobThresholds
    thresholds:
      0: Alive
      41: Dead
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 10 #8.5
    damage:
      types:
        Shock: 99999
    soundHit:
      collection: MetalThud
  - type: NoSlip
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        hard: false
        layer:
          - SlipLayer
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 20
        layer:
        - MachineLayer
        mask:
        - MobMask
  - type: TriggerOnStepTrigger
  - type: DeleteOnTrigger
 # - type: MouseRotator
 #   angleTolerance: 5
  #  rotationSpeed: 180
  #  simple4DirMode: false


- type: entity
  categories: [ HideSpawnMenu ]
  id: DronCorePortalWM
