- type: entity
  id: StationDronBeaconCore
  parent: BaseMachinePowered
  name: станция запуска Дрон республики
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
 # - type: RadarBlip
 #   color: "#0000e3"
 #   scale: 0.5
 #   shape: Square
 #   requireInSpace: false  
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: /Textures/_Fish/PlanetWar/WM2/32xSprait.rsi
    layers:
      - state: stationDronBlue
        scale: 1.5, 1.5
      - state: stationDronBluePimp
        shader: unshaded
        scale: 1.5, 1.5
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 6
    intensitySlope: 3
    totalIntensity: 6
    canCreateVacuum: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        density: 3000000
        mask:
        - FullTileMask
        layer:
        - BulletImpassable
        - Opaque
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 550
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: TimedSpawner
    chance: 1
    prototypes:
    - MarkerSpawnDronStationCore
    intervalSeconds: 400
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    table: !type:AllSelector
      children:
      - id: MarkerSpawnDronStationCore

- type: entity
  id: StationDronBeaconCoreWMMizeliy
  parent: StationDronBeaconCore
  components:
  - type: TimedSpawner
