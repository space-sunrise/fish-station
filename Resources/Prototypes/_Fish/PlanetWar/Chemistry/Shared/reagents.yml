- type: reagent
  slipData:
    requiredSlipSpeed: 50
  id: TricordrazinePW
  parent: Tricordrazine
  absorbent: true
  evaporationSpeed: 0.2
  tileReactions:
    - !type:CleanTileReaction {}
    - !type:CleanDecalsReaction {}
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: -1
            Radiation: -0.2
            Mangleness: -2.0
            Poison: -0.5
            Heat: -0.33
            Shock: -0.33
            Cold: -0.33


- type: reagent
  slipData:
    requiredSlipSpeed: 50
  id: EpinephrinePW
  parent: Epinephrine
  evaporationSpeed: 0.2
  absorbent: true
  tileReactions:
    - !type:CleanTileReaction {}
    - !type:CleanDecalsReaction {}
  metabolisms:
    Bloodstream:
      effects:
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: Histamine
          min: 45
        reagent: Histamine
        amount: -5
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        - !type:ReagentCondition
          reagent: EpinephrinePW
          max: 70
        damage:
          types:
            Cellular: -20
            Poison: -5
            Blunt: -10
            Heat: -10
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: EpinephrinePW
          min: 1
        damage:
          types:
            Mangleness: -20
            Cellular: -20
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: EpinephrinePW
          min: 70
        damage:
          types:
            Asphyxiation: 1
            Poison: 1
      - !type:AdjustReagent
        reagent: HeartbreakerToxin
        amount: -2
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: HeartbreakerToxin
          min: 1
        reagent: EpinephrinePW
        amount: -1
      - !type:AdjustReagent
        probability: 0.1
        conditions:
        - !type:ReagentCondition
          reagent: HeartbreakerToxin
          min: 1
        reagent: Histamine
        amount: 4
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 0.75
        type: Remove
      - !type:ModifyKnockdown
        time: 0.75
        type: Remove
      - !type:GenericStatusEffect
        key: Adrenaline 
        component: IgnoreSlowOnDamage
        time: 10


