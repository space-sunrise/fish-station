- type: entity
  id: WMGrusBaseBack
  name: посадка в транспортник
  parent: BaseMachinePowered
  description: A pneumatic waste disposal unit.
  placement:
    mode: SnapgridCenter
    snap:
    - Disposal
  components:
  - type: Transform
    anchored: false
  - type: Godmode
  - type: Sprite
   # drawdepth: WallTops #Items
    noRot: false
    sprite: /Textures/_Fish/PlanetWar/WM2/100xSprait.rsi
  #  state: seetellone
#  - type: Clickable
#  - type: Animateable
 # - type: DamageExaminable
 # - type: SurgeryTarget
 # - type: InteractionOutline
 # - type: CollisionWake
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      disposals: !type:Container
  - type: StaticPrice
    price: 70
  - type: PowerSwitch
  - type: Climbable
    vaultable: true
  - type: DisposalUnit
  - type: ThrowInsertContainer
    containerId: disposals
    probability: 0.67
  - type: UserInterface
    interfaces:
      enum.DisposalUnitUiKey.Key:
        type: DisposalUnitBoundUserInterface
  - type: Rummageable
    table: !type:NestedSelector
      tableId: RatKingLoot
  - type: RequireProjectileTarget
    active: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.1,-1.1,1.1,1.1"
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
        hard: false
