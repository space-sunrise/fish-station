# Standalone MARSOC combat helmet for BlueShield 100h loadout.
# ClothingHeadHelmetHardsuitTSF is a ToggleableClothing piece (no Item) and must not be given as head gear.

- type: entity
  parent: ClothingHeadHelmetTSF
  id: ClothingHeadHelmetTSFMARSOC
  name: MARSOC helmet
  description: A combat helmet styled after Trans-Solar Federation MARSOC gear. Armored and fireproof enough for blueshield duty, without being a hardsuit attachment.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Head/Hardsuits/tsf.rsi
  - type: Clothing
    sprite: _Sunrise/Clothing/Head/Hardsuits/tsf.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
        shader: unshaded
    equipDelay: 3
    unequipDelay: 3
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.75
        Heat: 0.8
        Caustic: 0.9
  - type: FireProtection
    reduction: 0.4
