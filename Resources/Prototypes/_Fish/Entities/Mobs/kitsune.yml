- type: entity
  parent: MobHuman
  id: MacKitsune

  components:
  # Fish-edit: «полувульпа»-скафы — голова/тело как у Human (как Inventory.speciesId: human у Vulpkanin),
  # хвост не входит в hideLayersOnEquip, чтобы EVA/Hardsuit HideLayerClothing его не скрывал.
  - type: HumanoidAppearance
    species: Kitsune
    hideLayersOnEquip:
    - Hair
    - Snout
    - HeadTop
    - Special
  # Fish-edit: тот же clothing species path, что у Vulpkanin — human-спрайты тела, без head-vulpkanin.
  - type: Inventory
    speciesId: human
  - type: Damageable
    damageModifierSet: Kitsune
  - type: KitsuneTransform
    actions:
    - ActionKitsuneTransform
    # - ActionKitsuneFire
    - ActionKitsuneFoxLights
  - type: KitsuneFoxLights
  - type: TemperatureDamage
    heatDamageThreshold: 400
    coldDamageThreshold: 200
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost

- type: entity
  parent: MacKitsune
  id: MobKitsunePrime
  suffix: ADMEME
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Critical
      500: Dead
  - type: KitsuneTransform
    actions:
    - ActionKitsuneTransform
    - ActionKitsuneFire
    - ActionKitsuneFoxLights
    - ActionFireball
    - ActionBlink
    - ActionForceWall
    - ActionSmite
    - ActionCluwne
    - ActionSlippery
    - ActionRepulse
    - ActionSmoke
    - ActionVoidApplause
    - ActionKnock
    - ActionMindSwap
    - ActionSpawnMagicarpSpell
