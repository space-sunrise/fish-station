# Fish — Syndicate pAI medical suite, support tools and module actions

- type: entity
  parent: HypoBorgMedicalSyndicate
  id: HypoPaiSyndicateMedical
  name: syndicate pAI hypospray
  description: An integrated Syndicate pAI hypospray. Regenerates combat-medicine reagents and can inject organics without hands.
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: SolutionRegeneration
    solution: hypospray
    duration: 2
    generated:
      reagents:
      - ReagentId: Omnizine
        Quantity: 1
  - type: SolutionRegenerationSwitcher
    options:
    - ReagentId: Omnizine
      Quantity: 1
    - ReagentId: Epinephrine
      Quantity: 1
    - ReagentId: TranexamicAcid
      Quantity: 1
    - ReagentId: DexalinPlus
      Quantity: 1
    - ReagentId: Ephedrine
      Quantity: 1
    keepSolution: false
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HypoPaiSyndicateMode
    allowedModes:
    - HypoPaiSyndicateMode
    currentTransferAmount: 5
    needHand: false
    breakOnHandChange: false
  - type: BorgHypospray

# Экстренный резервуар автодозатора — медленнее и меньше объём
- type: entity
  parent: HypoBorgMedicalSyndicate
  id: HypoPaiSyndicateAuto
  name: syndicate pAI emergency hypospray
  description: An emergency auto-dispenser reservoir for a Syndicate pAI. Regenerates slowly and only injects the bound owner.
  categories: [ HideSpawnMenu ]
  components:
  - type: SyndicatePaiAutoHypo
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 15
  - type: SolutionRegeneration
    solution: hypospray
    duration: 4
    generated:
      reagents:
      - ReagentId: SyndicatePaiTraumaPack
        Quantity: 0.5
  - type: SolutionRegenerationSwitcher
    options:
    - ReagentId: SyndicatePaiTraumaPack
      Quantity: 0.5
    - ReagentId: SyndicatePaiBurnPack
      Quantity: 0.5
    - ReagentId: SyndicatePaiCrisisPack
      Quantity: 0.5
    keepSolution: false
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HypoPaiSyndicateMode
    allowedModes:
    - HypoPaiSyndicateMode
    currentTransferAmount: 5
    needHand: false
    breakOnHandChange: false
  - type: BorgHypospray

- type: entity
  parent: GasAnalyzer
  id: GasAnalyzerPai
  name: pAI atmosphere sensor
  description: An integrated atmosphere sensor module for a personal AI.
  categories: [ HideSpawnMenu ]
  components:
  - type: ActivatableUI
    inHandsOnly: false
    requireActiveHand: false
    singleUser: true
    key: enum.GasAnalyzerUiKey.Key

# Actions

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiOpenMedical
  name: Medical Suite
  description: Open the Syndicate pAI medical suite.
  components:
  - type: Action
    icon: { sprite: Objects/Specific/Medical/syndihypo.rsi, state: hypo }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:SyndicatePaiOpenMedicalEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiScanOwner
  name: Scan Owner
  description: Instantly open a health scan of your bound master.
  components:
  - type: Action
    icon: { sprite: Objects/Specific/Medical/healthanalyzer.rsi, state: icon }
    itemIconStyle: NoItem
    useDelay: 1
  - type: InstantAction
    event: !type:SyndicatePaiScanOwnerEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiDoorHack
  name: Doorjack Pulse
  description: Disrupt access on doors within three tiles of your owner. Two minute cooldown.
  components:
  - type: Action
    icon: { sprite: Objects/Tools/access_breaker.rsi, state: icon }
    itemIconStyle: NoItem
    useDelay: 120
  - type: InstantAction
    event: !type:SyndicatePaiDoorHackEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSyndicatePaiSecRecords
  name: Security Records
  description: Remotely access and edit the station criminal records database.
  components:
  - type: Action
    icon: { sprite: Structures/Machines/server.rsi, state: server }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:SyndicatePaiOpenSecRecordsEvent
