- type: entity
  parent: VendingMachine
  id: VendingMachinePet
  name: PetMate
  description: Bring your pet to work!
  components:
  - type: VendingMachine
    pack: PetMateVendInventory
    dispenseOnHitChance: 0.25
    dispenseOnHitThreshold: 2
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    screenState: screen
    ejectDelay: 5
    soundVend: /Audio/Machines/machine_vend_hot_drink.ogg
    initialStockQuality: 0.33
  - type: Sprite
    sprite: _Fish/Structures/Machines/VendingMachines/petmate.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: "screen"
      map: ["enum.VendingMachineVisualLayers.Screen"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 2.0
    color: "#ffddaa"
  - type: PlayerCountDependentStock