# Базовые цели животных Fish Station

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseAnimalObjective
  components:
  - type: Objective
    issuer: objective-issuer-animal
    difficulty: 1
  - type: AnimalRoleRequirement

- type: entity
  abstract: true
  parent: [BaseAnimalObjective, BaseLivingObjective]
