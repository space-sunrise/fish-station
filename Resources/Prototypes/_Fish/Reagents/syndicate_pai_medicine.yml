# Fish — экстренные наборы автодозатора пИИ (~3 урона/тик, ~45 при дозе 15u)

- type: reagent
  id: SyndicatePaiTraumaPack
  name: reagent-name-syndicate-pai-trauma-pack
  group: Medicine
  desc: reagent-desc-syndicate-pai-trauma-pack
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#d97706"
  metabolisms:
    Medicine:
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -3
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: SyndicatePaiTraumaPack
          min: 18
        damage:
          types:
            Asphyxiation: 0.4
            Poison: 0.8

