- author: kotainfelix
  time: '2026-07-03T18:02:00.000000+00:00'
  changes:
  - type: Add
    message: Животным и грызунам (мыши, хомяки, улитки, мотыльки-тараканы) теперь выдаются случайные личные цели на смену — поесть, попить, исследовать станцию, выжить и улететь на шаттле.
