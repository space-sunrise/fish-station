- author: Kaiten
  time: '2026-07-25T12:45:00.000000+00:00'
  changes:
  - type: Fix
    message: Исправление КЗ под сроки и статьи рыбы.
  - type: Tweak
    message: Трансформация в лису теперь имеет длительность 4 минуты, чтобы людей не выкидывало никуда.
  - type: Fix
    message: Правка багов у Кицунэ расы.
  - type: Tweak
    message: Обновление гардероба ЦК офицеров и ОСО.
  - type: Fix
    message: Исправление печати Инструктора СБ.
  - type: Tweak
    message: Лимитки теперь бахают на 1 тайл, делайте хим гранаты как взрослые мальчики.
  - type: Tweak
    message: Обновление плюшки Михаила Пивноборода.
  - type: Add
    message: Добавлена Планетарная Война как отдельный постоянный режим игры.
  - type: Add
    message: Добавлена Планета Вульп как секретныый режим игры.
  - type: Fix
    message: Исправление багов разумной болезни.
  - type: Tweak
    message: По умолчанию игроки появляются в крио, если не поставили иначе (будет меньше жертв гибов от шаттлов Вигерса).
  - type: Fix
    message: Исправление багов ПВ.
  id: 3
- author: Pifagor
  time: '2026-07-25T12:45:00.000000+00:00'
  changes:
  - type: Add
    message: Добавлена уникальная верхняя одежда для роли Секторальный Судья — Мантия Секторального Суда.
  - type: Tweak
    message: 'Эскадрон Смерти на станции получил отдельную Fish-экипировку: скафандр, шлем, маску с тепловизором, магнитные ботинки и боевые перчатки со встроенным аплинком.'
  - type: Add
    message: Для Эскадрона Смерти добавлены два варианта перчаток с аплинком — стандартный (200 синих кристаллов и 200 кристаллитов) и бюджетный (80 синих кристаллов и 80 кристаллитов).
  - type: Add
    message: Маска Эскадрона Смерти получила встроенный тепловизор.
  - type: Add
    message: Добавлен спавнер персонажей игроков из гостов для ивентов. Ghost Character Spawner поддерживает массив фракций в YAML. Добавлены готовые варианты для ивентов Синдиката (Syndicate + Pirate) и Пиратов (Pirate).
  - type: Tweak
    message: У Кицунэ теперь видно хвост через скафандры.
  - type: Add
    message: Добавлена новая админ команда, форсирующая гост роль на объекте.
  - type: Add
    message: Добавление прозрачных плит/тайлов для мапперов.
  - type: Add
    message: Добавлена админ панель для отслеживания производительности сервера с указанием возможных причин и виновников (на F7).
  - type: Add
    message: Добавлены админ предупреждения, когда силовые поля у теслы и сингулярности разряжаются.
  id: 4
