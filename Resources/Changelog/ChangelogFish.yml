  - message: "Комплексный баланс Планетарной Войны: короба патронов в техфаб, одноразовый гранатомёт для лейтенанта и предводителя, осколки и усиленное ослепление у дронов, отключение разрушения тайлов у PV-взрывов, перенастройка скорострельности оружия и ёмкости гранатомётов инженера/строителя."
